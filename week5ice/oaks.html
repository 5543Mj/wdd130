<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dallin H. Oaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        body {
            background: #FFECD7;
        }
        div.card {
            background: #008DB1;
            text-align: center;
            border: 4px solid #004E63;
            border-radius: 30px;
            width: 390px;
            min-width: 280px;
            height: auto;
            box-sizing: border-box;
            padding: 28px 24px;
            margin: 24px auto;
            justify-content: center;
            align-items: center;
        }
        h1 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 36px;
            color: #FFFFFF;
            font-weight: Normal;
            margin: 0 0 8px 0;
        }
        h2 {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #91E4FB;
            font-size: 18px;
            font-weight: Normal;
            margin: 0 0 14px 0;
        }
        img {
            border: 5px solid #FFFFFF;
        }
        li {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-align: left;
            font-size: 20px;
            color: #FFFFFF;
            font-weight: Normal;
        }
        em {
            color: #FFD783;
            font-size: 20px;
            font-family: "Nanum Brush Script", cursive;
            font-weight: Normal;
        }

    </style>
</head>
<body>
    <div class="card">
        <h1>Dallin H. Oaks</h1>
        <h2>18th president</h2>
        <img src="img/oaks.webp" alt="Oak">
        <ul>
            <li>Born: Aug 12, 1932</li>
            <li>Apostle: Apr 7, 1984</li>
            <li>Prophet: Oct 14, 2025</li>
        </ul>
        <em>
            "The only permanent solution to the differences that divide us is for all of us to follow our Savior’s teachings and to gradually become even as He is"
        </em>
    </div>
</body>
</html>
